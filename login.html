<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a1930">
<title>دخول الأدمن | حميدو للصرافة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy-900:#050d1f;--navy-800:#0a1930;--navy-700:#0f2342;
  --gold:#d4af37;--gold-light:#f4e5a1;--gold-dark:#b8941f;
  --text:#ffffff;--text-sub:#b8c8e0;--text-dim:#5a7a9a;--red:#ff4d4d;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:radial-gradient(circle at 50% 0%,#0d2544 0%,#050d1f 70%);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;color:var(--text);overflow-x:hidden}
.gold-particles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.particle{position:absolute;width:6px;height:6px;background:radial-gradient(circle,#f4e5a1,#d4af37);border-radius:50%;opacity:.4;box-shadow:0 0 12px rgba(212,175,55,.8);animation:floatUp 15s linear infinite}
.p1{left:10%;animation-duration:18s}.p2{left:25%;animation-delay:3s;animation-duration:22s;width:4px;height:4px}.p3{left:40%;animation-delay:6s;animation-duration:16s}.p4{left:55%;animation-delay:2s;animation-duration:20s;width:5px;height:5px}.p5{left:70%;animation-delay:8s;animation-duration:19s}.p6{left:85%;animation-delay:4s;animation-duration:24s;width:4px;height:4px}
@keyframes floatUp{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:.6}90%{opacity:.4}100%{transform:translateY(-20vh) scale(1);opacity:0}}
.login-card{position:relative;z-index:2;width:100%;max-width:420px;background:linear-gradient(145deg,rgba(15,35,66,.85),rgba(10,25,48,.9));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1.5px solid rgba(212,175,55,.3);border-radius:28px;padding:32px 26px 28px;box-shadow:0 25px 60px rgba(5,13,31,.7),0 0 40px rgba(212,175,55,.15) inset;animation:cardEnter .6s cubic-bezier(.4,0,.2,1)}
@keyframes cardEnter{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.logo-wrap{width:90px;height:90px;margin:0 auto 18px;border-radius:22px;border:2px solid var(--gold);background:linear-gradient(145deg,#1e3a6b,#0a1930);display:flex;align-items:center;justify-content:center;font-size:3rem;font-weight:900;color:var(--gold);text-shadow:0 0 25px rgba(212,175,55,.9),0 0 50px rgba(212,175,55,.5);box-shadow:0 0 50px rgba(212,175,55,.5),0 0 0 1px rgba(212,175,55,.3) inset;animation:logoPulse 2.5s ease-in-out infinite;position:relative}
@keyframes logoPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.brand-title{text-align:center;font-size:1.6rem;font-weight:900;color:var(--gold);margin-bottom:4px;text-shadow:0 0 20px rgba(212,175,55,.7);letter-spacing:.5px}
.brand-sub{text-align:center;font-size:.7rem;color:#3d8be0;letter-spacing:4px;font-weight:800;margin-bottom:6px;text-shadow:0 0 10px rgba(61,139,224,.7);font-family:'Courier New',monospace}
.subtitle{text-align:center;font-size:.85rem;color:var(--text-sub);margin-bottom:24px;padding-bottom:18px;border-bottom:1px dashed rgba(212,175,55,.25);position:relative}
.subtitle::after{content:'🔐';position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);background:var(--navy-800);padding:0 10px;font-size:1rem}
.field{background:rgba(5,13,31,.6);border:1.5px solid rgba(61,139,224,.3);border-radius:14px;padding:10px 14px;margin-bottom:14px;transition:all .3s;position:relative}
.field:focus-within{border-color:var(--gold);box-shadow:0 0 20px rgba(212,175,55,.3),0 0 0 1px rgba(212,175,55,.2) inset}
.field label{display:block;color:var(--text-dim);font-size:.7rem;font-weight:700;margin-bottom:4px;letter-spacing:.5px}
.field input{width:100%;background:transparent;border:none;outline:none;color:var(--text);font-size:1rem;font-weight:700;padding:6px 0;font-family:'Courier New',monospace;letter-spacing:1px;direction:ltr;text-align:left}
.field input::placeholder{color:#3a4a5e;letter-spacing:0;font-weight:400}
.login-btn{width:100%;padding:15px 0;border:none;border-radius:14px;background:linear-gradient(145deg,var(--gold),var(--gold-dark));color:#0a1930;font-size:1rem;font-weight:900;font-family:inherit;cursor:pointer;box-shadow:0 6px 0 #5c4508,0 0 25px rgba(212,175,55,.4);transition:all .2s;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden}
.login-btn:hover{transform:translateY(-2px);box-shadow:0 8px 0 #5c4508,0 0 35px rgba(212,175,55,.6)}
.login-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #5c4508}
.login-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.login-btn .spinner{width:16px;height:16px;border:2px solid rgba(10,25,48,.3);border-top-color:#0a1930;border-radius:50%;animation:spin .8s linear infinite;display:none}
.login-btn.loading .spinner{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.msg{text-align:center;font-size:.78rem;font-weight:700;min-height:20px;margin-top:12px;padding:8px;border-radius:10px;opacity:0;transition:opacity .3s}
.msg.show{opacity:1}
.msg.error{color:var(--red);background:rgba(255,77,77,.1);border:1px solid rgba(255,77,77,.3)}
.msg.success{color:#22c55e;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3)}
.footer-note{text-align:center;font-size:.68rem;color:var(--text-dim);margin-top:20px;line-height:1.6}
.footer-note strong{color:#ff4444;font-weight:900}
.back-link{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:14px;color:var(--text-dim);font-size:.75rem;text-decoration:none;transition:color .3s;font-weight:700}
.back-link:hover{color:var(--gold)}
</style>
</head>
<body>
<div class="gold-particles" aria-hidden="true">
  <span class="particle p1"></span><span class="particle p2"></span><span class="particle p3"></span><span class="particle p4"></span><span class="particle p5"></span><span class="particle p6"></span>
</div>
<div class="login-card">
  <div class="logo-wrap">ح</div>
  <h1 class="brand-title">حميدو للصرافة</h1>
  <p class="brand-sub">HAMIDO EXCHANGE</p>
  <p class="subtitle">دخول لوحة التحكم — الأدمن فقط</p>
  <form id="loginForm" autocomplete="off">
    <div class="field">
      <label>📧 البريد الإلكتروني</label>
      <input type="email" id="email" placeholder="admin@example.com" required autocomplete="username">
    </div>
    <div class="field">
      <label>🔑 كلمة المرور</label>
      <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
    </div>
    <button type="submit" class="login-btn" id="loginBtn">
      <span class="spinner"></span>
      <span class="btn-text">دخول</span>
    </button>
    <div class="msg" id="msg"></div>
  </form>
  <a href="index.html" class="back-link">← العودة للتطبيق الرئيسي</a>
  <div class="footer-note">
    محمي بواسطة <strong>Firebase Authentication</strong><br>
    © شركة حميدو للبرمجة — عمر عثمان حميدو
  </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig = {
  apiKey: "AIzaSyAk6Y1lsTvFuG5QoVKc_fiL199P92C4C6I",
  authDomain: "azaz-exchange-db410.firebaseapp.com",
  databaseURL: "https://azaz-exchange-db410-default-rtdb.firebaseio.com",
  projectId: "azaz-exchange-db410",
  storageBucket: "azaz-exchange-db410.firebasestorage.app",
  messagingSenderId: "358926283407",
  appId: "1:358926283407:web:ad1b9f75a7c539d972b6fa"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
setPersistence(auth, browserLocalPersistence).catch(function(e) { console.warn(e); });
const loginForm = document.getElementById("loginForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const msg = document.getElementById("msg");
function showMsg(text, type) {
  msg.textContent = text;
  msg.className = "msg " + (type || "error") + " show";
}
onAuthStateChanged(auth, function(user) {
  if (user) {
    showMsg("✅ مرحباً بك — جاري التحويل...", "success");
    setTimeout(function() { window.location.href = "admin.html"; }, 600);
  }
});
loginForm.addEventListener("submit", async function(e) {
  e.preventDefault();
  const email = emailInput.value.trim();
  const password = passwordInput.value;
  if (!email || !password) { showMsg("⚠️ الرجاء إدخال البريد وكلمة المرور"); return; }
  loginBtn.disabled = true;
  loginBtn.classList.add("loading");
  showMsg("");
  try {
    const uc = await signInWithEmailAndPassword(auth, email, password);
    showMsg("✅ تم الدخول بنجاح — جاري التحويل...", "success");
    setTimeout(function() { window.location.href = "admin.html"; }, 700);
  } catch (error) {
    let errorText = "❌ فشل تسجيل الدخول";
    switch (error.code) {
      case "auth/invalid-email": errorText = "❌ البريد غير صحيح"; break;
      case "auth/user-not-found": errorText = "❌ البريد غير مسجل"; break;
      case "auth/wrong-password": errorText = "❌ كلمة المرور خاطئة"; break;
      case "auth/invalid-credential": errorText = "❌ البريد أو كلمة المرور غير صحيحة"; break;
      case "auth/too-many-requests": errorText = "⚠️ محاولات كثيرة — انتظر"; break;
      case "auth/network-request-failed": errorText = "❌ فشل الاتصال"; break;
      default: errorText = "❌ " + (error.message || "خطأ غير معروف");
    }
    showMsg(errorText, "error");
    passwordInput.value = "";
    passwordInput.focus();
  } finally {
    loginBtn.disabled = false;
    loginBtn.classList.remove("loading");
  }
});
setTimeout(function() { emailInput.focus(); }, 400);
</script>
</body>
  </html>
