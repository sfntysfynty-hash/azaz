<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.json">
<title>حميدو للصرافة | HAMIDO EXCHANGE</title>
<style>
:root{--brand-blue:#0d5cb8;--brand-blue-light:#1e7ae0;--brand-blue-dark:#084080;--bg-body:#050810;--bg-container:#0a0f1a;--bg-panel:#0c1320;--bg-card:#0a0e18;--bg-input:#03060d;--bg-field:#03060d;--bg-mini:#070b14;--text-main:#fff;--text-sub:#b8c2d4;--text-dim:#5a6a85;--text-title:#dde4f0;--red-buy:#ff3b3b;--orange-sell:#ffaa33;--red-deep:#b30000;--orange-deep:#cc5500;--border-main:#1a3a6a;--border-soft:#12264a;--border-panel:#1e4a80;--border-buy:#a10000;--border-sell:#a04a00;--grad-header:linear-gradient(145deg,#0a1428,#050a14);--grad-admin:linear-gradient(145deg,#08101e,#0a1428);--shadow-main:0 25px 40px rgba(13,92,184,0.3);--shadow-panel:0 0 20px #0a1a30 inset,0 10px 20px #00000060;--shadow-card:0 0 18px #0a1a30 inset,0 4px 8px #00000080;--glow-red:0 0 15px #ff0000,0 0 30px #b30000;--glow-orange:0 0 15px #ff8800,0 0 30px #cc5500;--glow-blue:0 0 12px #1e7ae0,0 0 24px #0d5cb8;--up-color:#22c55e;--down-color:#ef4444;--gold-color:#ffd700;--gold-shadow:0 0 12px #ffd70080,0 0 24px #b8860b40}
html[data-theme="light"]{--bg-body:#e8eef8;--bg-container:#fff;--bg-panel:#f4f7fb;--bg-card:#fff;--bg-input:#fff;--bg-field:#fff;--bg-mini:#f8fafc;--text-main:#0a1a2e;--text-sub:#3a4a5e;--text-dim:#7a8a9e;--text-title:#0a1a2e;--red-buy:#d10000;--orange-sell:#d97706;--red-deep:#a10000;--border-main:#c8d8e8;--border-soft:#dce6f0;--border-panel:#b8cce0;--border-buy:#d10000;--border-sell:#d97706;--grad-header:linear-gradient(145deg,#e8f0fc,#d8e6f8);--grad-admin:linear-gradient(145deg,#fff,#f0f6fc);--shadow-main:0 15px 30px rgba(13,92,184,0.15);--shadow-card:0 0 12px #e0ecf8 inset,0 4px 8px #00000010;--glow-red:0 0 10px #ff000050;--glow-orange:0 0 10px #ff880050;--glow-blue:0 0 10px #0d5cb850;--up-color:#16a34a;--down-color:#dc2626;--gold-color:#b8860b;--gold-shadow:0 0 10px #ffd70060}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,'Cairo',system-ui,sans-serif}
body{background:var(--bg-body);min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:20px 16px 40px;background-image:radial-gradient(circle at 20% 0%,rgba(13,92,184,.35) 0%,transparent 50%),radial-gradient(circle at 80% 100%,rgba(8,64,128,.3) 0%,transparent 50%);transition:background .4s,color .4s}
.app-container{width:100%;max-width:480px;background:var(--bg-container);border-radius:42px;padding:22px 18px 30px;box-shadow:var(--shadow-main),0 0 0 1px var(--border-soft) inset;border:1px solid var(--border-main);position:relative;overflow:hidden}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:14px;border-bottom:2px solid var(--brand-blue);position:relative;z-index:2}
.header::after{content:'';position:absolute;bottom:-2px;right:0;width:90px;height:2px;background:var(--brand-blue-light);box-shadow:0 0 12px var(--brand-blue-light)}
.brand-block{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
.logo-letter{width:64px;height:64px;border-radius:18px;border:2px solid #ff2222;background:linear-gradient(145deg,#0d5cb8,#084080);display:flex;align-items:center;justify-content:center;font-size:2.2rem;font-weight:900;color:#fff;text-shadow:0 0 15px rgba(255,255,255,.8),0 0 30px rgba(13,92,184,1);box-shadow:0 4px 15px rgba(255,34,34,.3),0 0 20px rgba(13,92,184,.5) inset;flex-shrink:0;transition:all .3s}
.logo-letter::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.3),transparent 50%);pointer-events:none}
.brand-block:hover .logo-letter{box-shadow:0 4px 25px rgba(255,34,34,.7),0 0 30px rgba(13,92,184,.6) inset;transform:scale(1.03)}
.brand-text{display:flex;flex-direction:column;gap:2px;text-align:right}
.brand-text .brand-name-ar{color:#ff4444;font-weight:900;font-size:1.05rem;text-shadow:0 0 10px rgba(255,68,68,.5);line-height:1.1}
.brand-text .brand-name-en{color:#0d5cb8;font-size:.62rem;letter-spacing:2.5px;font-weight:800;text-shadow:0 0 8px rgba(13,92,184,.7);font-family:'Courier New',monospace}
.header-controls{display:flex;align-items:center;gap:8px}
.icon-btn{background:var(--bg-panel);border:1px solid var(--border-main);color:var(--text-sub);width:38px;height:38px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.1rem;transition:all .25s;font-family:inherit}
.icon-btn:hover{border-color:var(--brand-blue-light);color:var(--brand-blue-light);box-shadow:var(--glow-blue)}
.admin-badge{color:var(--text-sub);font-size:.78rem;font-weight:700;background:var(--bg-panel);border:1px solid var(--border-main);padding:7px 12px;border-radius:30px;cursor:pointer;transition:all .3s;display:flex;align-items:center;gap:5px}
.admin-badge:hover{border-color:var(--brand-blue-light);color:var(--brand-blue-light);box-shadow:var(--glow-blue)}
.status-bar{background:var(--bg-card);border-radius:14px;padding:9px 14px;margin-bottom:14px;border:1px solid var(--border-soft);display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.7rem;position:relative;z-index:2}
.status-item{display:flex;align-items:center;gap:5px;color:var(--text-sub);font-weight:600}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--up-color);box-shadow:0 0 8px var(--up-color);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.main-tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;position:relative;z-index:2}
.main-tab{background:var(--bg-panel);border:2px solid var(--border-main);color:var(--text-sub);padding:16px 10px;border-radius:20px;cursor:pointer;font-family:inherit;font-weight:800;font-size:1rem;transition:all .3s;display:flex;align-items:center;justify-content:center;gap:8px;user-select:none}
.main-tab .tab-icon{font-size:1.4rem}
.main-tab:hover{border-color:var(--brand-blue-light);color:var(--brand-blue-light);transform:translateY(-2px)}
.main-tab.active{background:linear-gradient(145deg,rgba(13,92,184,.3),rgba(8,64,128,.2));border-color:var(--brand-blue-light);color:#fff;box-shadow:var(--glow-blue),0 0 12px rgba(30,122,224,.3) inset;text-shadow:0 0 10px rgba(30,122,224,.8)}
.page{display:none;animation:pageFadeIn .35s ease}
.page.active{display:block}
@keyframes pageFadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.section-label{color:var(--text-dim);font-size:.7rem;font-weight:800;letter-spacing:2px;margin-bottom:8px;padding-right:6px;display:flex;align-items:center;gap:8px;position:relative;z-index:2}
.section-label::after{content:'';flex:1;height:1px;background:linear-gradient(to left,transparent,var(--brand-blue))}
.rates-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:14px;position:relative;z-index:2}
.rate-card{background:var(--bg-card);border-radius:20px;padding:12px 14px 10px;border:1px solid var(--border-soft);box-shadow:var(--shadow-card);transition:all .3s;cursor:pointer;user-select:none}
.rate-card:hover{transform:translateY(-2px);border-color:var(--brand-blue-light);box-shadow:0 0 25px rgba(13,92,184,.4)}
.rate-card.gold-card{border-color:#8b6914;background:linear-gradient(145deg,var(--bg-card),rgba(255,215,0,.05))}
.rate-card-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding-bottom:6px;border-bottom:1px dashed var(--border-soft)}
.rate-card-title .pair{color:var(--text-title);font-size:.82rem;font-weight:800;display:flex;align-items:center;gap:6px}
.rate-card-title .pair .flag-icons{font-size:1rem}
.gold-title{color:var(--gold-color)!important}
.rate-card-values{display:flex;gap:8px}
.rate-mini{flex:1;background:var(--bg-mini);border-radius:12px;padding:8px 6px 6px;text-align:center;display:flex;flex-direction:column;gap:2px;border:1px solid}
.rate-mini.buy-mini{border-color:var(--border-buy)}
.rate-mini.sell-mini{border-color:var(--border-sell)}
.rate-mini .mini-label{font-size:.6rem;font-weight:700}
.rate-mini.buy-mini .mini-label{color:var(--red-buy)}
.rate-mini.sell-mini .mini-label{color:var(--orange-sell)}
.rate-mini .mini-value{font-size:1rem;font-weight:900;direction:ltr;font-family:'Courier New',monospace;display:flex;align-items:center;justify-content:center;gap:4px}
.rate-mini.buy-mini .mini-value{color:var(--red-buy);text-shadow:var(--glow-red)}
.rate-mini.sell-mini .mini-value{color:var(--orange-sell);text-shadow:var(--glow-orange)}
.gold-card .mini-value{color:var(--gold-color)!important;text-shadow:var(--gold-shadow)!important}
.trend-indicator{font-size:.75rem;font-weight:900;line-height:1;display:inline-flex;align-items:center}
.trend-up{color:var(--up-color)}
.trend-down{color:var(--down-color)}
.trend-flat{color:var(--text-dim);font-size:.65rem}
.tap-hint{text-align:center;color:var(--text-dim);font-size:.68rem;margin-top:4px;opacity:.7}
.calc-box{background:var(--bg-panel);border-radius:26px;padding:18px 16px;border:1px solid var(--border-panel);box-shadow:var(--shadow-panel);margin-bottom:14px;position:relative;z-index:2}
.calc-title{color:var(--brand-blue-light);font-size:.85rem;font-weight:800;text-align:center;margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:10px;text-shadow:0 0 10px rgba(30,122,224,.6)}
.calc-title::before,.calc-title::after{content:'';height:1px;flex:1;background:linear-gradient(to right,transparent,var(--brand-blue),transparent)}
.calc-input-row{display:flex;gap:8px;margin-bottom:12px}
.calc-input{flex:1;background:var(--bg-input);border:2px solid var(--brand-blue);border-radius:18px;padding:4px 4px 4px 16px;display:flex;align-items:center;box-shadow:0 0 15px rgba(13,92,184,.3)}
.calc-input input{flex:1;background:transparent;border:none;padding:12px 0;font-size:1.8rem;font-weight:900;color:var(--text-main);outline:none;text-align:left;direction:ltr;font-family:'Courier New',monospace;width:100%;min-width:0}
.calc-input input::placeholder{color:var(--text-dim);font-size:1.1rem;font-weight:400}
.currency-select{background:var(--brand-blue);border:none;color:#fff;font-size:.9rem;font-weight:800;padding:0 14px;height:52px;border-radius:14px;cursor:pointer;outline:none;font-family:inherit;direction:rtl;min-width:110px;text-align:right}
.results-box{display:grid;grid-template-columns:1fr;gap:8px}
.result-item{background:var(--bg-input);border-radius:14px;padding:10px 14px;border:1px solid var(--border-soft);display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.result-item:hover{border-color:var(--brand-blue-light)}
.result-item.gold-result{border-color:#8b6914;background:linear-gradient(145deg,var(--bg-input),rgba(255,215,0,.03))}
.result-item .res-label{display:flex;align-items:center;gap:8px;color:var(--text-sub);font-size:.8rem;font-weight:700}
.result-item .res-value{color:var(--brand-blue-light);font-size:1.1rem;font-weight:900;font-family:'Courier New',monospace;direction:ltr;text-shadow:0 0 10px rgba(30,122,224,.6)}
.result-item.gold-result .res-value{color:var(--gold-color);text-shadow:var(--gold-shadow)}
.result-item .res-unit{color:var(--text-dim);font-size:.7rem;font-weight:700;margin-right:4px}
.calc-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.calc-action-btn{background:var(--bg-input);border:1.5px solid var(--border-main);color:var(--text-sub);font-weight:800;font-size:.85rem;padding:14px 10px;border-radius:14px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:7px}
.calc-action-btn.print-btn{border-color:rgba(255,170,51,.4);color:var(--orange-sell)}
.calc-action-btn.clear-btn{border-color:rgba(77,166,255,.4);color:#4da6ff}
.action-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;position:relative;z-index:2}
.action-btn{background:var(--bg-panel);border:1.5px solid var(--border-main);color:var(--text-sub);font-weight:800;font-size:.82rem;padding:13px 10px;border-radius:16px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:7px}
.action-btn.export-btn{color:#4da6ff;border-color:rgba(77,166,255,.4)}
.action-btn.import-btn{color:#a78bfa;border-color:rgba(167,139,250,.4)}
.admin-panel{background:var(--grad-admin);border-radius:26px;padding:0 16px;border:1.5px solid var(--brand-blue);box-shadow:0 0 30px rgba(13,92,184,.4);max-height:0;overflow:hidden;opacity:0;transition:max-height .8s ease,opacity .4s ease,padding .4s ease,margin-top .4s ease;position:relative;z-index:2}
.admin-panel.open{max-height:4000px;opacity:1;padding:18px 16px;margin-top:8px}
.admin-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border-main)}
.admin-title{color:var(--brand-blue-light);font-size:.9rem;font-weight:800;display:flex;align-items:center;gap:8px}
.admin-title::before{content:'';width:8px;height:8px;background:var(--brand-blue-light);border-radius:50%;box-shadow:0 0 12px var(--brand-blue-light)}
.logout-btn{background:var(--bg-input);border:1px solid var(--red-deep);color:var(--red-buy);font-size:.7rem;font-weight:700;padding:6px 12px;border-radius:30px;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:inherit}
.admin-section-title{color:var(--brand-blue-light);font-size:.78rem;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.admin-section-title::before{content:'';width:5px;height:5px;background:var(--brand-blue-light);border-radius:50%;box-shadow:0 0 8px var(--brand-blue-light)}
.admin-rate-group{background:var(--bg-input);border:1px solid var(--border-soft);border-radius:16px;padding:10px 12px 8px;margin-bottom:10px}
.admin-rate-group-title{color:var(--brand-blue-light);font-size:.72rem;font-weight:700;margin-bottom:8px}
.adjust-row{display:flex;gap:8px}
.adjust-field{flex:1;background:var(--bg-field);border-radius:10px;border:1.5px solid var(--border-soft);padding:7px 10px}
.adjust-field.buy-field{border-color:var(--border-buy)}
.adjust-field.sell-field{border-color:var(--border-sell)}
.adjust-field label{display:block;font-size:.62rem;font-weight:700;margin-bottom:3px}
.adjust-field.buy-field label{color:var(--red-buy)}
.adjust-field.sell-field label{color:var(--orange-sell)}
.adjust-field input{background:transparent;border:none;width:100%;color:var(--text-main);font-size:.9rem;font-weight:800;padding:2px 0;outline:none;text-align:left;direction:ltr;font-family:'Courier New',monospace}
.save-btn{width:100%;background:linear-gradient(145deg,var(--brand-blue),var(--brand-blue-dark));border:1px solid var(--brand-blue-light);color:#fff;font-weight:800;font-size:.9rem;padding:13px 0;border-radius:14px;cursor:pointer;box-shadow:0 4px 0 #041e40;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;margin-top:8px}
.save-feedback{text-align:center;font-size:.75rem;margin-top:8px;min-height:16px;font-weight:700;color:var(--up-color);opacity:0;transition:opacity .3s}
.save-feedback.show{opacity:1}
.divider{height:1px;background:linear-gradient(to right,transparent,var(--brand-blue),transparent);margin:18px 0 14px;position:relative}
.divider::after{content:'🔒';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--bg-container);padding:0 10px;font-size:.85rem}
.password-field{background:var(--bg-field);border-radius:12px;border:1.5px solid var(--border-soft);padding:8px 12px;margin-bottom:8px}
.password-field label{display:block;color:var(--text-sub);font-size:.65rem;font-weight:700;margin-bottom:3px}
.password-field input{background:transparent;border:none;width:100%;color:var(--text-main);font-size:.9rem;font-weight:700;padding:4px 0;outline:none;text-align:left;direction:ltr;font-family:'Courier New',monospace;letter-spacing:2px}
.password-field input::placeholder{color:var(--text-dim);letter-spacing:1px;font-weight:400}
.change-pass-btn{width:100%;background:linear-gradient(145deg,var(--brand-blue-dark),#041e40);border:1px solid var(--brand-blue);color:#fff;font-weight:800;font-size:.85rem;padding:12px 0;border-radius:12px;cursor:pointer;box-shadow:0 4px 0 #020c1c;display:flex;align-items:center;justify-content:center;gap:6px;font-family:inherit;margin-top:4px}
.pass-feedback{text-align:center;font-size:.72rem;margin-top:8px;min-height:16px;font-weight:700;opacity:0;transition:opacity .3s}
.pass-feedback.show{opacity:1}
.pass-feedback.success{color:var(--up-color)}
.pass-feedback.error{color:var(--down-color)}
.current-value-badge{display:inline-flex;align-items:center;gap:6px;background:var(--bg-input);border:1px solid var(--brand-blue);color:var(--brand-blue-light);padding:5px 12px;border-radius:30px;font-size:.72rem;font-weight:700;margin-bottom:10px;font-family:'Courier New',monospace}
.current-value-badge .label{color:var(--text-dim);font-family:'Segoe UI',Tahoma,sans-serif}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:9999;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;padding:20px}
.modal-overlay.open{opacity:1;visibility:visible}
.modal-box{background:var(--bg-container);border:1.5px solid var(--brand-blue);border-radius:26px;padding:24px 20px 20px;width:100%;max-width:370px;box-shadow:0 0 50px rgba(13,92,184,.6);text-align:center;transform:scale(.9);transition:transform .3s;max-height:92vh;overflow-y:auto}
.modal-overlay.open .modal-box{transform:scale(1)}
.modal-icon{font-size:2.3rem;margin-bottom:6px;filter:drop-shadow(0 0 12px var(--brand-blue-light))}
.modal-title{color:var(--brand-blue-light);font-size:1.15rem;font-weight:800;margin-bottom:4px}
.modal-sub{color:var(--text-dim);font-size:.72rem;margin-bottom:16px}
.modal-field{background:var(--bg-field);border-radius:12px;border:1.5px solid var(--border-main);padding:8px 12px;margin-bottom:8px;text-align:right}
.modal-field label{display:block;color:var(--text-sub);font-size:.65rem;font-weight:700;margin-bottom:3px}
.modal-field input{width:100%;background:transparent;border:none;padding:5px 0;font-size:.95rem;color:var(--text-main);text-align:left;letter-spacing:3px;outline:none;direction:ltr;font-family:'Courier New',monospace;font-weight:700}
.modal-field input.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.modal-error{color:var(--down-color);font-size:.75rem;margin-top:4px;margin-bottom:4px;min-height:18px;font-weight:700}
.modal-success{color:var(--up-color);font-size:.75rem;margin-top:4px;margin-bottom:4px;min-height:18px;font-weight:700}
.modal-actions{display:flex;gap:8px;margin-top:14px}
.modal-btn{flex:1;border:none;padding:12px 0;border-radius:12px;font-weight:800;font-size:.88rem;cursor:pointer;font-family:inherit}
.modal-btn.primary{background:linear-gradient(145deg,var(--brand-blue),var(--brand-blue-dark));color:#fff;box-shadow:0 4px 0 #041e40;border:1px solid var(--brand-blue-light)}
.modal-btn.ghost{background:var(--bg-panel);color:var(--text-sub);border:1px solid var(--border-main)}
.forgot-btn{background:transparent;border:none;color:var(--text-dim);font-size:.72rem;font-weight:600;margin-top:12px;padding:8px 4px;cursor:pointer;text-decoration:underline;font-family:inherit}
.recover-section{display:none}
.recover-section.visible{display:block}
.recover-back-btn{background:transparent;border:none;color:var(--text-dim);font-size:.72rem;font-weight:600;margin-top:8px;padding:6px 4px;cursor:pointer;font-family:inherit}
.receipt{display:none;background:#fff;color:#000;padding:25px;max-width:400px;margin:0 auto;font-family:'Courier New
